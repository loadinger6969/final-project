name: CI

# Runs on every pull request that targets a protected branch.
# A PR can only be merged when this workflow is green.
on:
  pull_request:
    branches: [dev, staging, main]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check app ml tests

      - name: Ruff format check
        run: ruff format --check app ml tests

      - name: Run test suite
        run: pytest -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t wine-app:ci .
